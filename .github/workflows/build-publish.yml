name: Build & Publish - GHCR

on:
  # A successful CI run is the only automatic publication trigger.
  workflow_run:
    workflows: ["CI - Validación"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Servicio que se reconstruye
        required: true
        default: recetas-api
        type: choice
        options: [recetas-api, recetas-web, recetas-admin, all]

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Preparar release
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      service: ${{ steps.release.outputs.service }}
    steps:
      - id: release
        env:
          DISPATCH_SERVICE: ${{ inputs.service }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          source_sha="${RUN_SHA:-${GITHUB_SHA}}"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_id=${source_sha}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "service=${DISPATCH_SERVICE:-all}" >> "$GITHUB_OUTPUT"

  build-publish:
    name: Build y publicar en GHCR
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        include:
          - name: recetas-api
            context: ./recetas-api
            dockerfile: ./recetas-api/Dockerfile.prod
          - name: recetas-web
            context: ./recetas-web
            dockerfile: ./recetas-web/Dockerfile.prod
          - name: recetas-admin
            context: ./recetas-admin
            dockerfile: ./recetas-admin/Dockerfile.prod
    if: needs.prepare.outputs.service == 'all' || needs.prepare.outputs.service == matrix.name

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Obtener metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.release_id }}

      - name: Build y push - ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_COMMIT_SHA=${{ needs.prepare.outputs.source_sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Verificar PHP final (AMD64 y ARM64)
        if: matrix.name == 'recetas-api'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/recetas-api:${{ needs.prepare.outputs.release_id }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" "$IMAGE" php -r \
              'if (PHP_VERSION_ID < 80427) { fwrite(STDERR, PHP_VERSION." is older than 8.4.27\\n"); exit(1); } echo PHP_VERSION, PHP_EOL;'
          done

      - name: Attestar imagen
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release-manifest:
    name: Publicar manifiesto
    needs: [prepare, build-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Crear manifiesto
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          SERVICE: ${{ needs.prepare.outputs.service }}
        run: |
          printf 'source_sha=%s\nrelease_id=%s\nservice=%s\n' "$SOURCE_SHA" "$RELEASE_ID" "$SERVICE" > release.env
      - uses: actions/upload-artifact@v6
        with:
          name: recetas-release-${{ github.run_id }}
          path: release.env
          retention-days: 90

  notify:
    name: Notificar
    runs-on: ubuntu-latest
    needs: [prepare, build-publish, release-manifest]
    if: always()

    steps:
      - name: Resumen
        run: |
          echo "✅ Imágenes publicadas en GHCR"
          echo "Release: ${{ needs.prepare.outputs.release_id }}"
          echo ""
          echo "Servicio seleccionado: ${{ needs.prepare.outputs.service }}"
