name: CI - Validación

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  backend:
    name: Backend - PHP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, mbstring, curl, dom, xml, intl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        run: |
          cd recetas-api
          composer validate --no-check-all

      - name: Verificar sintaxis PHP
        run: |
          find recetas-api/src -name "*.php" -exec php -l {} \;
          find recetas-api/bootstrap -name "*.php" -exec php -l {} \;

      - name: Localizar caché de Composer
        id: composer-cache
        working-directory: recetas-api
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('recetas-api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Instalar dependencias
        run: cd recetas-api && composer install --no-interaction --prefer-dist

      - name: Análisis estático (PHPStan)
        run: cd recetas-api && composer run stan

      - name: Tests (PHPUnit)
        run: cd recetas-api && composer run test

  frontend-web:
    name: Frontend Web - React/TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: recetas-web/package-lock.json

      - name: Instalar dependencias
        run: cd recetas-web && npm ci

      - name: Lint (ESLint)
        run: cd recetas-web && npm run lint

      - name: Build
        run: cd recetas-web && npm run build

  frontend-admin:
    name: Frontend Admin - React-admin/TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: recetas-admin/package-lock.json

      - name: Instalar dependencias
        run: cd recetas-admin && npm ci

      - name: Lint (ESLint)
        run: cd recetas-admin && npm run lint

      - name: Build
        run: cd recetas-admin && npm run build

  docker:
    name: Docker - Validar builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build recetas-api
        uses: docker/build-push-action@v7
        with:
          context: ./recetas-api
          file: ./recetas-api/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=recetas-api
          cache-to: type=gha,mode=max,scope=recetas-api
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}

      - name: Build recetas-web
        uses: docker/build-push-action@v7
        with:
          context: ./recetas-web
          file: ./recetas-web/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=recetas-web
          cache-to: type=gha,mode=max,scope=recetas-web

      - name: Build recetas-admin
        uses: docker/build-push-action@v7
        with:
          context: ./recetas-admin
          file: ./recetas-admin/Dockerfile.prod
          push: false
          cache-from: type=gha,scope=recetas-admin
          cache-to: type=gha,mode=max,scope=recetas-admin
