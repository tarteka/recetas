name: Rollback - Manual

on:
  workflow_dispatch:
    inputs:
      service:
        description: Servicio a recuperar
        required: true
        default: recetas-api
        type: choice
        options: [recetas-api, recetas-web, recetas-admin, all]
      image_tag:
        description: Tag inmutable publicado (SHA-run_id)
        required: true
        type: string

concurrency:
  group: recetas-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback a versión anterior
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validar entrada
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}-[0-9]+$ ]]; then
            echo "❌ Tag inmutable inválido"
            exit 1
          fi
          echo "✅ Tag válido para $SERVICE"
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SERVICE: ${{ inputs.service }}

      - name: Ejecutar rollback en VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SERVICE,IMAGE_TAG
          script: |
            set -eu
            cd /opt/recetas
            chmod +x scripts/apply-release.sh
            ./scripts/apply-release.sh "$SERVICE" "$IMAGE_TAG"

      - name: Falló el rollback ❌
        if: failure()
        run: |
          echo "❌ Rollback fallido"
          echo ""
          echo "Pasos manuales:"
          echo "1. Conectarse al VPS"
          echo "2. cd /opt/recetas"
          echo "3. docker compose -f compose.prod.yaml logs"
          echo "4. Revisar qué falló"
