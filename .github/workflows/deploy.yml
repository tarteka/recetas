name: Deploy - Producción

on:
  workflow_run:
    workflows: ["Build & Publish - GHCR"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: Servicio a desplegar
        required: true
        type: choice
        options: [recetas-api, recetas-web, recetas-admin, all]
      release_tag:
        description: Tag inmutable publicado (SHA-run_id)
        required: true
        type: string

concurrency:
  group: recetas-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Preparar despliegue explícito
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run')
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
      service: ${{ steps.release.outputs.service }}
    steps:
      - name: Descargar manifiesto automático
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v6
        with:
          name: recetas-release-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Crear manifiesto manual
        if: github.event_name == 'workflow_dispatch'
        env:
          SERVICE: ${{ inputs.service }}
          RELEASE_ID: ${{ inputs.release_tag }}
        run: |
          source_sha="${RELEASE_ID%-*}"
          printf 'source_sha=%s\nrelease_id=%s\nservice=%s\n' "$source_sha" "$RELEASE_ID" "$SERVICE" > release.env

      - name: Validar manifiesto
        id: release
        run: |
          set -a
          . ./release.env
          set +a
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_id" =~ ^[0-9a-f]{40}-[0-9]+$ ]]
          case "$service" in recetas-api|recetas-web|recetas-admin|all) ;; *) exit 1 ;; esac
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"

  deploy:
    name: Desplegar a VPS
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read

    steps:
      - name: Desplegar a VPS
        uses: appleboy/ssh-action@v1.2.5
        env:
          SERVICE: ${{ needs.prepare.outputs.service }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: SERVICE,RELEASE_ID,SOURCE_SHA
          script: |
            set -eu
            cd /opt/recetas
            git fetch --quiet origin
            CURRENT_SHA="$(git rev-parse HEAD)"
            if [ "$CURRENT_SHA" != "$SOURCE_SHA" ] && git merge-base --is-ancestor "$SOURCE_SHA" "$CURRENT_SHA"; then
              echo "❌ Release obsoleta: $SOURCE_SHA es anterior a $CURRENT_SHA"
              exit 1
            fi
            git checkout --quiet "$SOURCE_SHA"
            chmod +x scripts/apply-release.sh
            ./scripts/apply-release.sh "$SERVICE" "$RELEASE_ID"

      - name: Falló el despliegue ❌
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/recetas
            echo "❌ Despliegue fallido. Revisando logs..."
            docker compose -f compose.prod.yaml logs --tail=50

            echo ""
            echo "⚠️  Para rollback manual:"
            echo "   RECETAS_API_TAG=<sha-run_id> docker compose -f compose.prod.yaml up -d --no-deps recetas-api"
