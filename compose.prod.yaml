name: recetas-produccion

services:
  recetas-api:
    image: ghcr.io/tarteka/recetas/recetas-api:${RELEASE_TAG:-latest}
    pull_policy: always
    environment:
      RECETAS_API_TOKEN: ${RECETAS_API_TOKEN:?Configura RECETAS_API_TOKEN en .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_GOOGLE_REDIRECT_URI: ${ADMIN_GOOGLE_REDIRECT_URI:-https://recetas.proyectozero.org/api/admin/auth/google/callback}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-https://recetas.proyectozero.org}
    volumes:
      - ./datos:/datos
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - recetas-interna
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/salud') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  recetas-web:
    image: ghcr.io/tarteka/recetas/recetas-web:${RELEASE_TAG:-latest}
    pull_policy: always
    environment:
      RECETAS_DOMINIO: ${RECETAS_DOMINIO:-recetas.proyectozero.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - recetas-interna
    depends_on:
      recetas-api:
        condition: service_healthy
      recetas-admin:
        condition: service_started
    restart: unless-stopped

  recetas-admin:
    image: ghcr.io/tarteka/recetas/recetas-admin:${RELEASE_TAG:-latest}
    pull_policy: always
    networks:
      - recetas-interna
    restart: unless-stopped

networks:
  recetas-interna:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
