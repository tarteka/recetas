services:
  recetas-api:
    build:
      context: ./recetas-api

    container_name: recetas-api

    volumes:
      - ./recetas-api:/app
      - ./datos:/datos

    working_dir: /app

    ports:
      - "127.0.0.1:8080:8080"

    networks:
      - recetas-interna

    environment:
      COMPOSER_HOME: /tmp/composer
      RECETAS_API_TOKEN: ${RECETAS_API_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      ADMIN_GOOGLE_REDIRECT_URI: ${ADMIN_GOOGLE_REDIRECT_URI:-http://localhost:5174/api/admin/auth/google/callback}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-http://localhost:5174}

    restart: unless-stopped

  recetas-web:
    build:
      context: ./recetas-web

    container_name: recetas-web

    volumes:
      - ./recetas-web:/app

    working_dir: /app

    ports:
      - "127.0.0.1:5173:5173"

    networks:
      - recetas-interna

    restart: unless-stopped

  recetas-admin:
    build:
      context: ./recetas-admin

    container_name: recetas-admin

    volumes:
      - ./recetas-admin:/app

    working_dir: /app

    ports:
      - "127.0.0.1:5174:5173"

    networks:
      - recetas-interna

    depends_on:
      - recetas-api

    restart: unless-stopped

networks:
  recetas-interna:
    driver: bridge
